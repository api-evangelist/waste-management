meters:
  - name: service_pickup
    description: Scheduled waste / recycling pickup events delivered under
      the WM customer service agreement (the API exposes these events but
      does not bill them per call).
    unit: pickup
    aggregation: sum
    dimensions:
      - account
      - service_type
  - name: extra_service
    description: Ad-hoc on-call pickups, container swaps, and contamination
      surcharges added to the monthly invoice.
    unit: event
    aggregation: sum
    dimensions:
      - account
      - charge_type
principles:
  - name: Visibility
    description: Use the WM Account / Services / Invoices APIs to pull
      monthly service consumption and invoice line items; reconcile API-
      reported events against the customer-portal invoice view.
  - name: Allocation
    description: Allocate environmental-service spend to site / property /
      cost-center using the WM account-id dimension; tag containers and
      pickup schedules to map them to the consuming team.
  - name: Optimization
    description: Use Pickup Schedules and ETAs to right-size pickup cadence
      and container count; reduce contamination surcharges by improving
      stream sorting at the source.
  - name: Accountability
    description: Facilities / property-management owns the WM contract and
      per-site allocation; engineering owns API-key / JWT hygiene for the
      portal integration.
