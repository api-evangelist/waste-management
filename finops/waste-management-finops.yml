description: FinOps view of Waste Management (WM) at the corporate level. WM
  does not bill API consumption directly; the API surface (account, services,
  invoices, pickups, ETAs) is a read interface to the existing service
  contract whose costs are environmental-service charges, not API line items.
sources:
  - https://www.wm.com
notes: No metered API invoice; FOCUS attribution maps onto the underlying WM
  service contract.
