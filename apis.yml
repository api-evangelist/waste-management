aid: waste-management
name: Waste Management
description: >-
  Waste Management (WM) is the largest environmental services company in North America, providing waste collection,
  transfer, disposal, and recycling services to over 20 million residential, commercial, industrial, and municipal
  customers across the United States. WM provides RESTful APIs for customers and third-party integrators to access
  account data including balance, services, invoices, pickup schedules, and ETAs via JWT authentication.
