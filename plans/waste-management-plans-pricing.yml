description: Waste Management (WM) provides RESTful APIs (account balance,
  services, invoices, pickup schedules, ETAs) authenticated via JWT, but
  does not operate a public, self-service developer portal with a published
  pricing tier. Access is provisioned for direct customers and integration
  partners; no list price is documented. Trimmed scaffold to a single Contact
  Sales plan.
sources:
  - https://www.wm.com
notes: API access is provisioned to existing WM customers and integration
  partners; no public self-service plan or per-call price list is published.
plans:
  - id: waste-management-contact-sales
    name: Contact Sales
    type: enterprise
    description: Waste Management API access (account, services, invoices,
      pickup schedules, ETAs) is provisioned under the customer / integration
      agreement; no metered self-service plan is offered.
    entries:
      - label: API Access
        name: api_access
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Account API
      - name: Services API
      - name: Invoices API
      - name: Pickup Schedules API
      - name: ETAs API
      - name: JWT Authentication
